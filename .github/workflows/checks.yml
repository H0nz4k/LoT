name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install -r iot/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q iot lcd integrations install.py
      - run: node --check web/iot.js
      - run: sh -n install.sh update.sh
      - run: docker compose config --quiet
