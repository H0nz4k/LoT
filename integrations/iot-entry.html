<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT · HanzHub</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 0,#172a50,transparent 65%),#070b12;color:#e9edf5;font:15px system-ui,sans-serif;padding:24px}.panel{max-width:500px;border:1px solid #ffffff20;background:#0f1625bd;padding:32px;border-radius:18px}h1{font-size:24px}p{color:#aab4c5;line-height:1.7}a,button{color:#32dc82}button{background:#ffffff0a;border:1px solid #ffffff20;border-radius:9px;padding:10px 16px;cursor:pointer}
</style></head><body><main class="panel"><h1>IoT moduly</h1><p id="message" role="status">Otevírám chytrou domácnost…</p><button id="retry" hidden>Zkusit znovu</button><p><a href="index.html">Zpět na HanzHub</a></p></main><script>
'use strict';
const button = document.getElementById('retry');
async function openIoT() {
  button.hidden = true;
  document.getElementById('message').textContent = 'Otevírám chytrou domácnost…';
  try {
    const host = location.hostname;
    const lan = /^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host) || host.endsWith('.local');
    const base = lan ? `http://${host}:4010` : location.origin;
    const response = await fetch(base + '/api/services', {cache:'no-store', signal:AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error();
    const data = await response.json(), card = data.services.find(item => item.key === 'iot');
    const url = new URL(card?.url || '');
    if (!['http:','https:'].includes(url.protocol) || url.href === location.href) throw new Error();
    location.replace(url.href);
  } catch (_) {
    document.getElementById('message').textContent = 'Odkaz na IoT není dostupný. Ověř spuštění IoT služby a její kartu v nastavení HanzHubu. Výchozí místní adresa je http://192.168.1.3:4011.';
    button.hidden = false;
  }
}
button.addEventListener('click', openIoT); openIoT();
</script></body></html>
